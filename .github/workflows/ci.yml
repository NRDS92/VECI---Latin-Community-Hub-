
name: CI

on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # 3. Instalar dependencias desde package-lock.json
      - name: Install dependencies
        run: npm ci

      # 4. Compilar los contratos compartidos
      - name: Build shared contracts
        run: npm run build --workspace=@ndrs92/contracts

      - name: Run Contracts tests
        run: npm run test --workspace=@ndrs92/contracts

      - name: Build Backend and shared packages
        run: npm run build

      # 5. Ejecutar tests
      - name: Run tests
        run: npm run test

      - name: Run Mobile tests
        run: npm test --prefix apps/mobile -- --runInBand

      - name: Type-check Mobile
        run: npx tsc --noEmit -p apps/mobile/tsconfig.json

      - name: Lint Mobile
        run: npm run lint --prefix apps/mobile

      - name: Export Android bundle
        working-directory: apps/mobile
        run: npx --no-install expo export --platform android
